name: Bug report
description: Report unexpected behaviour with a reproducible example.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve crprune. Search existing issues first.
        Remove tokens and private registry data from examples and logs.
        For a security vulnerability, use [private reporting](https://github.com/JohanLindvall/crprune/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: crprune version
      description: Output of crprune --version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and installation method. Include terminal or CI runner details if relevant.
      placeholder: Ubuntu 24.04, arm64, release installer
    validations:
      required: true
  - type: dropdown
    id: registry
    attributes:
      label: Registry
      options:
        - Azure Container Registry (ACR)
        - GitHub Container Registry (GHCR)
        - Local command / no registry
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, a minimal rule file or synthetic input, and relevant image tags or relationships. Say whether this was a dry run.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: For batch commands, --progress=plain makes logs easier to share; -v adds debug detail.
      render: text
